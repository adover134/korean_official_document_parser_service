[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwp-hierarchical-md"
version = "0.1.0"
description = "Convert hierarchical Korean HWP/HWPX official documents to structure-preserving Markdown"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
hwp2md = "hwp_hierarchical_md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
